# HTTP : défis Let's Encrypt, webhook Pomofocus (POST sur /, en HTTP, il ne
# suit pas de redirection), et redirection de tout le reste vers HTTPS.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = / {
        if ($request_method != POST) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://webhook:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name timer.co-libri.org;

    # Certificat Let's Encrypt, renouvelé par le service certbot du compose.
    ssl_certificate /etc/letsencrypt/live/timer.co-libri.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timer.co-libri.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    location / {
        proxy_pass http://webhook:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
