# Port 80, public : seulement le webhook Pomofocus (POST sur /, en HTTP, il ne
# sait ni s'authentifier ni suivre une redirection). Tout le reste part vers
# https://, où Caddy demande le mot de passe.
server {
    listen 80;
    server_name _;

    location = / {
        if ($request_method != POST) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://webhook:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 8080, publié sur 127.0.0.1 seulement : la porte d'entrée de Caddy (VPS),
# qui assure HTTPS et le mot de passe devant https://timer.co-libri.org.
server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass http://webhook:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}
